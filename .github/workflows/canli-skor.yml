name: Canlı Skor Güncelleme

on:
  schedule:
    # Günün tam programını Türkiye saati 06:00'da hazırla (UTC 03:00)
    - cron: '0 3 * * *'
    # Türkiye saatiyle yaklaşık 12:00–24:00 arası, 10 dakikada bir (UTC 09:00–21:00)
    - cron: '*/10 9-21 * * *'
    # Gece ve sabah hattı: FotMob yedeğiyle 30 dakikada bir (API-Football kotasını korur)
    - cron: '*/30 0-8,22-23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: golhat-content-writer
  cancel-in-progress: false

jobs:
  update-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Veri dönüştürme testleri
        run: npm test

      - name: Günün maç programını ve canlı skorları çek
        env:
          PREFER_FOTMOB: ${{ github.event.schedule == '*/30 0-8,22-23 * * *' && 'true' || 'false' }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/fetch-canli-skor.js

      - name: Değişiklik varsa commit et ve gönder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "golhat-bot"
          git config user.email "actions@github.com"
          git add data/canli-skorlar.json
          if git diff --cached --quiet; then
            echo "Skor değişikliği yok."
            exit 0
          fi
          git commit -m "Canlı skor güncelleme $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push origin HEAD:main
