name: Canlı Skor Güncelleme

on:
  schedule:
    # Türkiye saatiyle yaklaşık 12:00–24:00 arası, 15 dakikada bir (UTC 09:00–21:00)
    - cron: '*/15 9-21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Canlı skorları API-Football'dan çek
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/fetch-canli-skor.js

      - name: Değişiklik varsa commit et ve gönder
        run: |
          git config user.name "golhat-bot"
          git config user.email "actions@github.com"
          git add data/canli-skorlar.json
          git diff --cached --quiet || git commit -m "Canlı skor güncelleme $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
