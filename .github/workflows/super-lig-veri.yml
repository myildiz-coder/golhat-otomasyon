name: Süper Lig Puan ve Fikstür

on:
  schedule:
    # GitHub Actions'ın izin verdiği en sık aralık: maç saatlerinde beş dakikada bir.
    - cron: '*/5 9-23 * * *'
    # Gece/sabah düşük trafikte yarım saatlik denetim yeterlidir.
    - cron: '*/30 0-8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: golhat-content-writer
  queue: max
  cancel-in-progress: false

jobs:
  update-super-lig:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Veri dönüştürme testleri
        run: npm test

      - name: Puan cetveli ve sıradaki haftayı çek
        id: standings
        run: node scripts/fetch-super-lig-tff.js

      - name: Değişiklik varsa commit et ve gönder
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "golhat-league-bot"
          git config user.email "actions@github.com"
          git add data/super-lig.json
          if git diff --cached --quiet; then
            echo "Süper Lig verisinde değişiklik yok."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Süper Lig puan ve fikstür güncelleme $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Puan değişikliğini öncelikli maç masasına gönder
        if: steps.publish.outputs.changed == 'true' && steps.standings.outputs.semantic_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run editorial-kategoriler.yml --ref main \
            -f role=priority_matchdesk \
            -f dry_run=false \
            -f assignment="TFF canlı verisinde puan/sıra veya maç sonucu değişti. İlgili kulüp ve Süper Lig gelişmesini resmî TFF verisi ve bağımsız kaynakla doğrula; haber değeri varsa gecikmeden yayımla."
