name: GOLHAT Araştırma ve Özel Haber Kurulu

on:
  schedule:
    # Derin araştırma vardiyası: her dört saatte bir özgün dosya fırsatlarını tarar.
    - cron: '40 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Yalnızca araştır; dosya yayımlama
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: golhat-content-writer
  queue: max
  cancel-in-progress: false

env:
  OPENAI_MODEL: gpt-5.6-luna

jobs:
  research-desk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Yayın güvenliği ve SEO testleri
        run: npm test
      - name: Araştırma kurulunu çalıştır
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error title=Eksik secret::OPENAI_API_KEY tanımlı değil"
            exit 1
          fi
          args=(--role ozel_haber)
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${DRY_RUN:-true}" == "true" ]]; then
            args+=(--dry-run)
          fi
          node scripts/run-editorial.js "${args[@]}"
      - name: Doğrulanan dosyayı yayımla
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "golhat-research-desk"
          git config user.email "actions@github.com"
          git add data/editorial/state.json ozel-haber.html sitemap.xml news-sitemap.xml
          if [[ -d haber ]]; then git add haber; fi
          if git diff --cached --quiet; then
            echo "Yayınlanabilir yeni araştırma dosyası yok."
            exit 0
          fi
          git commit -m "Araştırma dosyası $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Birleşik GOLHAT yayınını doğrula ve eşitle
        if: ${{ success() && (github.event_name == 'schedule' || inputs.dry_run == false) }}
        run: node scripts/publication-sync.js
