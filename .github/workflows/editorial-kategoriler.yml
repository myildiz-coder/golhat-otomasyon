name: GOLHAT Kategori Editörleri

on:
  schedule:
    # 7/24 vardiya: bütün sayfa editörleri saatte iki kez güncel gelişmeleri tarar.
    - cron: '5,35 * * * *'
  workflow_dispatch:
    inputs:
      role:
        description: Çalıştırılacak editör
        required: true
        type: choice
        default: all
        options:
          - all
          - fenerbahce
          - galatasaray
          - besiktas
          - trabzonspor
          - anadolu
          - super_lig
          - avrupa
          - sampiyonlar_ligi
          - uefa
          - transfer
          - yorum
          - ozel_haber
          - priority_matchdesk
      dry_run:
        description: Yalnızca araştır ve doğrula; dosyaları değiştirme
        required: true
        type: boolean
        default: true
      assignment:
        description: Editöre verilecek özel güncel yayın görevi
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: golhat-content-writer
  cancel-in-progress: false

env:
  OPENAI_MODEL: gpt-5.6-luna

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Güvenlik ve HTML testleri
        run: npm test

      - name: Kategori editörlerini çalıştır
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SELECTED_ROLE: ${{ inputs.role }}
          DRY_RUN: ${{ inputs.dry_run }}
          GOLHAT_EDITORIAL_ASSIGNMENT: ${{ inputs.assignment }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error title=Eksik secret::OPENAI_API_KEY GitHub Actions secret olarak tanımlı değil"
            exit 1
          fi

          args=(--all)
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${SELECTED_ROLE:-}" == "priority_matchdesk" ]]; then
            args=(--priority-matchdesk)
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "${SELECTED_ROLE:-}" && "$SELECTED_ROLE" != "all" ]]; then
            args=(--role "$SELECTED_ROLE")
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${DRY_RUN:-true}" == "true" ]]; then
            args+=(--dry-run)
          fi

          node scripts/run-editorial.js "${args[@]}"

      - name: Değişen sayfalarda yayın öncesi mizanpaj kapısı
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pages < <(git diff --name-only -- '*.html')
          if (( ${#pages[@]} == 0 )); then
            echo "Mizanpajı değişen HTML sayfası yok."
            exit 0
          fi
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$browser" ]]; then
            echo "::error title=Mizanpaj tarayıcısı bulunamadı::Yayın öncesi görsel denetim için Chrome/Chromium gerekli"
            exit 1
          fi
          export GOLHAT_BROWSER_PATH="$browser"
          mkdir -p layout-prepublish
          for page in "${pages[@]}"; do
            safe="$(printf '%s' "$page" | tr '/\\' '--')"
            node scripts/layout-audit.js --page "$page" --report "layout-prepublish/${safe}.json" --screenshots "layout-prepublish/${safe}-shots"
          done

      - name: Yayın öncesi mizanpaj kanıtını sakla
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: yayin-oncesi-mizanpaj-${{ github.run_id }}
          path: layout-prepublish
          if-no-files-found: ignore
          retention-days: 14

      - name: Değişiklik varsa commit et ve gönder
        id: publish
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "golhat-editorial-bot"
          git config user.email "actions@github.com"
          git add data/editorial/state.json ./*.html sitemap.xml news-sitemap.xml
          if [[ -d haber ]]; then git add haber; fi
          if git diff --cached --quiet; then
            echo "Yayınlanacak değişiklik yok."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Editoryal güncelleme $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Öncelikli maç haberini baş editöre gönder
        if: inputs.role == 'priority_matchdesk' && steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run editorial-bas-editor.yml --ref main -f dry_run=false
